{% extends "base.html" %}
{% block title %}页面不存在 · {{ app_name }}{% endblock %}
{% block content %}
<div class="error-page">
  <span class="error-code">ERROR 404</span>
  <h1>这一页不在档案里。</h1>
  <p>链接可能已经失效，或者内容被删除了。回到工作台继续。</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard') if g.user else url_for('index') }}">返回{{ '工作台' if g.user else '首页' }}</a>
</div>
{% endblock %}
